name: Feature request
description: Something OpenVirtualSoundcard should do.
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What you need
      description: The problem or workflow, and how you would like it to work.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Platform, Dante devices, applications involved, and anything you tried.
