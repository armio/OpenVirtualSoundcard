name: Release

# A tag v<version> builds the macOS installer package and attaches it to a
# draft GitHub release, for a maintainer to review and publish. Started by
# hand (Actions, Release, Run workflow), it only builds the package, as an
# artifact of the run, and never touches a release. With the signing
# secrets set (docs/RELEASING.md) the package is signed with a Developer ID
# and notarized; without them it is unsigned.
#
# Three jobs, so that the third-party code a build runs (crates' build
# scripts and proc macros, cargo-about) never runs where the signing keys
# or a token that can write to the repository are:
#   build    compiles everything, signed ad hoc, with no secrets
#   package  signs and packages what build made, and runs no cargo
#   release  attaches the package to a draft release (tag pushes only)
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

# One run per tag or branch at a time, so that two runs never both create a
# draft release for a tag.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            apps/macos
      - name: The tag matches the version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          for manifest in Cargo.toml apps/macos/Cargo.toml; do
            version=$(sed -n 's/^version = "\(.*\)"$/\1/p' "$manifest" | head -n 1)
            if [ "$GITHUB_REF_NAME" != "v$version" ]; then
              echo "::error::the tag is $GITHUB_REF_NAME but $manifest says $version"
              exit 1
            fi
          done
      - name: Install cargo-about
        run: cargo install cargo-about@0.9.2 --locked --features cli
      - name: Build
        env:
          BUILD: 1
          UNIVERSAL: 1
        run: |
          packaging/macos/build-pkg.sh
          # A tar keeps the modes that the artifact's zip would drop.
          tar -C target/macos -cf macos-build.tar OpenVirtualSoundcard.driver \
            OpenVirtualSoundcard.app ovsc THIRD-PARTY-LICENSES.html
      - uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: macos-build.tar
          if-no-files-found: error
          # As long as GitHub lets the run be re-run: "Re-run failed jobs"
          # downloads it again.
          retention-days: 30

  package:
    needs: build
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      SIGNED: ${{ secrets.MACOS_SIGNING_CERTIFICATES != '' }}
      BUILT: ${{ github.workspace }}/target/macos
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: macos-build
      - name: Unpack the build
        run: |
          mkdir -p "$BUILT"
          tar -C "$BUILT" -xf macos-build.tar
      - name: Signing keychain and notarization credentials
        if: env.SIGNED == 'true'
        env:
          CERTIFICATES: ${{ secrets.MACOS_SIGNING_CERTIFICATES }}
          CERTIFICATES_PASSWORD: ${{ secrets.MACOS_SIGNING_PASSWORD }}
          NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER }}
        run: |
          keychain=$RUNNER_TEMP/signing.keychain-db
          password=$(/usr/bin/openssl rand -hex 16)
          /usr/bin/security create-keychain -p "$password" "$keychain"
          /usr/bin/security set-keychain-settings -lut 3600 "$keychain"
          /usr/bin/security unlock-keychain -p "$password" "$keychain"
          echo "$CERTIFICATES" | /usr/bin/base64 --decode >"$RUNNER_TEMP/certificates.p12"
          /usr/bin/security import "$RUNNER_TEMP/certificates.p12" -k "$keychain" \
            -P "$CERTIFICATES_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productsign
          rm "$RUNNER_TEMP/certificates.p12"
          /usr/bin/security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          # shellcheck disable=SC2046
          /usr/bin/security list-keychains -d user -s "$keychain" $(/usr/bin/security list-keychains -d user | tr -d '"')
          echo "$NOTARY_KEY" >"$RUNNER_TEMP/notary.p8"
          /usr/bin/xcrun notarytool store-credentials ovsc-notary --key "$RUNNER_TEMP/notary.p8" \
            --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER"
          rm "$RUNNER_TEMP/notary.p8"
          echo "NOTARY_PROFILE=ovsc-notary" >>"$GITHUB_ENV"
      - name: Package
        env:
          DRIVER: ${{ env.BUILT }}/OpenVirtualSoundcard.driver
          DAEMON: ${{ env.BUILT }}/ovsc
          APP: ${{ env.BUILT }}/OpenVirtualSoundcard.app
          NOTICES: ${{ env.BUILT }}/THIRD-PARTY-LICENSES.html
          CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
          INSTALLER_IDENTITY: ${{ secrets.MACOS_INSTALLER_IDENTITY }}
        run: packaging/macos/build-pkg.sh
      - name: Remove the signing keychain
        if: always() && env.SIGNED == 'true'
        run: /usr/bin/security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
      - uses: actions/upload-artifact@v4
        with:
          name: macos-pkg
          path: dist/*.pkg
          if-no-files-found: error

  release:
    needs: package
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: macos-pkg
          path: dist
      - name: Attach it to a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # A published release keeps the package it was reviewed with: a
          # re-run of an old tag's run must not replace it. Only a release
          # that does not exist is created: any other failure to look it up
          # stops here rather than make a second draft for the tag.
          err=$RUNNER_TEMP/release-view.err
          if draft=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft 2>"$err"); then
            if [ "$draft" != true ]; then
              echo "::error::release $GITHUB_REF_NAME is already published; not replacing its package"
              exit 1
            fi
          elif grep -qx 'release not found' "$err"; then
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
              --title "OpenVirtualSoundcard ${GITHUB_REF_NAME#v}" --generate-notes
          else
            echo "::error::could not look up release $GITHUB_REF_NAME: $(cat "$err")"
            exit 1
          fi
          gh release upload "$GITHUB_REF_NAME" dist/*.pkg --clobber
