name: Release

# A tag v<version> builds the macOS installer package and attaches it to a
# draft GitHub release, for a maintainer to review and publish. Started by
# hand (Actions, Release, Run workflow), it only builds the package, as an
# artifact. With the signing secrets set (docs/RELEASING.md) the package is
# signed with a Developer ID and notarized; without them it is unsigned.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos-pkg:
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      SIGNED: ${{ secrets.MACOS_SIGNING_CERTIFICATES != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            apps/macos
      - name: The tag matches the version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          for manifest in Cargo.toml apps/macos/Cargo.toml; do
            version=$(sed -n 's/^version = "\(.*\)"$/\1/p' "$manifest" | head -n 1)
            if [ "$GITHUB_REF_NAME" != "v$version" ]; then
              echo "::error::the tag is $GITHUB_REF_NAME but $manifest says $version"
              exit 1
            fi
          done
      - name: Install cargo-about
        run: cargo install cargo-about --locked --features cli
      - name: Signing keychain and notarization credentials
        if: env.SIGNED == 'true'
        env:
          CERTIFICATES: ${{ secrets.MACOS_SIGNING_CERTIFICATES }}
          CERTIFICATES_PASSWORD: ${{ secrets.MACOS_SIGNING_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          keychain=$RUNNER_TEMP/signing.keychain-db
          password=$(openssl rand -hex 16)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$CERTIFICATES" | base64 --decode >"$RUNNER_TEMP/certificates.p12"
          security import "$RUNNER_TEMP/certificates.p12" -k "$keychain" \
            -P "$CERTIFICATES_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productsign
          rm "$RUNNER_TEMP/certificates.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          xcrun notarytool store-credentials ovsc-notary --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD"
          echo "NOTARY_PROFILE=ovsc-notary" >>"$GITHUB_ENV"
      - name: Build the package
        env:
          BUILD: 1
          UNIVERSAL: 1
          CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
          INSTALLER_IDENTITY: ${{ secrets.MACOS_INSTALLER_IDENTITY }}
        run: packaging/macos/build-pkg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos-pkg
          path: dist/*.pkg
      - name: Attach it to a draft release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
              --title "OpenVirtualSoundcard ${GITHUB_REF_NAME#v}" --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" dist/*.pkg --clobber
