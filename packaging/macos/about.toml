# cargo-about's settings for the licence notices shipped with the macOS
# package (third-party-licenses.sh). The accepted licences are deny.toml's.
# The app's notices also use about-app.toml, which holds what only the app
# needs, such as deny.toml's exception for the app's fonts.
accepted = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "GPL-3.0-or-later",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
# What the package contains: the Mac builds only.
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
