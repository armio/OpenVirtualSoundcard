# Rotates the OpenVirtualSoundcard daemon log: at 1 MiB, keeping 5 old files.
# Installed as /etc/newsyslog.d/org.openvirtualsoundcard.conf.
#
# launchd opens the log for the daemon and the daemon never reopens it, so
# after a rotation the daemon keeps writing to ovsc.log.0 until it
# restarts. The old files are therefore left uncompressed: compressing would
# delete the file the daemon is still writing to.
#
# logfilename                          [owner:group]  mode  count  size(KB)  when  flags
/Library/Logs/OpenVirtualSoundcard/ovsc.log  root:wheel     644   5      1024      *     N
