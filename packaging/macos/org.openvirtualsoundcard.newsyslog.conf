# Rotates the OpenVirtualSoundcard daemon log: at 1 MiB, keeping 5 old files.
# Installed as /etc/newsyslog.d/org.openvirtualsoundcard.conf.
#
# The daemon writes the log itself (ovsc run --log-file) and looks every
# 5 s whether ovsc.log is still the file it writes to; after a rotation it
# opens the new ovsc.log. So no signal is needed (flag N), and the lines of
# those few seconds end up in ovsc.log.0. That is also why ovsc.log.0 is
# left uncompressed: the daemon may still be writing to it right after the
# rotation, and compressing would delete it.
#
# logfilename                          [owner:group]  mode  count  size(KB)  when  flags
/Library/Logs/OpenVirtualSoundcard/ovsc.log  root:wheel     644   5      1024      *     N
