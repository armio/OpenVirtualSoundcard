# cargo-deny's policy (https://embarkstudios.github.io/cargo-deny/): every
# dependency's licence must allow distributing it with GPL-3.0-or-later
# code, crates come from crates.io only, and known advisories fail the
# check. CI checks the workspace and apps/macos with it.

[advisories]
version = 2
ignore = [
    # paste is unmaintained, not vulnerable: a compile-time macro that
    # netdev's Linux netlink crates use.
    { id = "RUSTSEC-2024-0436", reason = "unmaintained compile-time macro, via netdev" },
]

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "GPL-3.0-or-later",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
# The policy is shared by two workspaces: a licence one of them never meets
# is no warning.
unused-allowed-license = "allow"
# Licences allowed for one crate each, all compatible with the GPL: crates
# that GPUI, the app's GUI toolkit, uses.
exceptions = [
    # MPL-2.0 (GPL-compatible as a secondary licence): cbindgen generates
    # GPUI's Metal shader header at build time; option-ext is part of dirs;
    # dwrote is Windows-only.
    { allow = ["MPL-2.0"], crate = "cbindgen" },
    { allow = ["MPL-2.0"], crate = "option-ext" },
    { allow = ["MPL-2.0"], crate = "dwrote" },
    # CC0-1.0, a public-domain dedication: in naga (Linux rendering) and
    # const-random.
    { allow = ["CC0-1.0"], crate = "hexf-parse" },
    { allow = ["CC0-1.0"], crate = "tiny-keccak" },
    # NCSA, a permissive licence: rav1e's fuzzing hook, compiled only for
    # fuzzing.
    { allow = ["NCSA"], crate = "libfuzzer-sys" },
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
